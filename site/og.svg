<!-- The social preview image. Regenerate public/og.png after a change:
     rsvg-convert -w 1200 -h 630 og.svg -o public/og.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Eutaxy: deterministic simulation and formal proof for Cloudflare Workers</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(43 105) scale(1.15)" color="#FFFFFF">
    <!-- Links stop inside each junction ring, so the ring holes stay clear -->
    <g stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="56.74" y1="30"  x2="133.26" y2="30"/>
      <line x1="56.74" y1="100" x2="133.26" y2="100"/>
      <line x1="56.74" y1="170" x2="133.26" y2="170"/>
      <line x1="143.26" y1="40"  x2="143.26" y2="90"/>
      <line x1="143.26" y1="110" x2="143.26" y2="160"/>
    </g>
    <path fill="currentColor" fill-rule="evenodd" d="
      M129.26,30 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z M138.26,30 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 Z
      M129.26,100 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z M138.26,100 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 Z
      M129.26,170 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z M138.26,170 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0 Z"/>
    <g fill="currentColor">
      <circle cx="56.74" cy="30"  r="11"/>
      <circle cx="56.74" cy="100" r="11"/>
      <circle cx="56.74" cy="170" r="11"/>
    </g>
  </g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#f8fafc">
    <text x="300" y="252" font-size="104" font-weight="700" letter-spacing="-2">Eutaxy</text>
    <text x="96" y="420" font-size="44" font-weight="500" fill="#e2e8f0">Deterministic simulation and formal proof</text>
    <text x="96" y="476" font-size="44" font-weight="500" fill="#e2e8f0">for Cloudflare Workers</text>
    <text x="96" y="560" font-size="30" fill="#5eead4">eutaxy.dev</text>
  </g>
</svg>
