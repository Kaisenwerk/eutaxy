name: Pull request title

# A pull request is squash-merged as "<title> (#<number>)", so its title is
# checked by the same script as a commit message (.githooks/commit-msg). The
# title is passed through the environment, never interpolated into the script.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .githooks
          persist-credentials: false
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node .githooks/commit-msg --title "$TITLE"
