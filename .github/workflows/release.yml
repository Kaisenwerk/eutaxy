name: release

# Release-please keeps a release pull request open with the next version and
# changelog, computed from Conventional Commits since the last tag. Merging
# that pull request creates the GitHub release and the v* tag, and the
# publish job then publishes eutaxy to npm through trusted
# publishing (OIDC) with provenance. No npm token is stored anywhere.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (11.5.1+)
        run: |
          npm install -g npm@latest
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Cache the pinned Lean toolchain
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('packages/prover-lean/src/lean.ts') }}
      - name: Install the pinned Lean toolchain (prover-lean contract corpus)
        # elan (Lean's toolchain manager) at a pinned release, checksum-verified, then the Lean release
        # the engine is pinned to (leanToolchain in packages/prover-lean/src/lean.ts).
        run: |
          set -eu
          TOOLCHAIN=$(sed -n 's/^export const leanToolchain = "\(.*\)";$/\1/p' packages/prover-lean/src/lean.ts)
          test -n "$TOOLCHAIN"
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            ELAN_VERSION=v4.2.4
            ELAN_SHA256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
            curl -sSfL -o /tmp/elan.tar.gz "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
            echo "$ELAN_SHA256  /tmp/elan.tar.gz" | sha256sum -c -
            tar -xzf /tmp/elan.tar.gz -C /tmp elan-init
            /tmp/elan-init -y --no-modify-path --default-toolchain none
          fi
          "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"
          "$HOME/.elan/bin/elan" run "$TOOLCHAIN" lean --version
      - run: pnpm check
        env:
          EUTAXY_REQUIRE_LEAN: "1"
      - run: pnpm build
      - name: Use the repository README for the npm page
        run: node scripts/npm-readme.ts "${{ needs.release-please.outputs.tag_name }}" packages/eutaxy/README.md
      - name: Pack with publishConfig applied
        run: |
          mkdir -p release
          pnpm --filter eutaxy pack --pack-destination "$(pwd)/release"
          ls -l release
          tar -xOzf release/*.tgz package/README.md | head -n 1 | grep -qx '# Eutaxy'
      - name: Publish with provenance
        run: npm publish ./release/*.tgz --access public --provenance
