name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the pinned prover toolchains
        uses: actions/cache@v6
        with:
          path: ~/.cache/eutaxy/toolchains
          key: provers-${{ runner.os }}-${{ hashFiles('packages/prover-lean/src/lean.ts', 'packages/prover-smt/src/z3.ts') }}
      - name: Install the pinned provers with eutaxy prover install (the v0.11 gate)
        # The command, from the sources: the Lean and Z3 releases the engines are pinned to (leanDownloads,
        # z3Downloads), checksum-verified, into the cache the engines look in first. Nothing else installs them.
        run: |
          node packages/eutaxy/bin/eutaxy.mjs prover install lean
          node packages/eutaxy/bin/eutaxy.mjs prover install smt
      - run: pnpm check
        env:
          EUTAXY_REQUIRE_LEAN: "1"
          EUTAXY_REQUIRE_Z3: "1"
